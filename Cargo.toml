[package]
name = "roadviewer-hars"
version = "2.0.0-alpha.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/Qualified4/roadviewer-hars"
build = "build.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["macros", "multipart"] }
base64 = "0.22"
bytes = "1"
crc32fast = "1"
capnp = "0.25"
flate2 = "1"
ffmpeg-next = { version = "9", default-features = false, features = ["format", "codec", "software-scaling"] }
fs2 = "0.4"
futures-util = { version = "0.3", default-features = false }
hex = "0.4"
hmac = "0.12"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
md-5 = "0.10"
rand = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tar = { version = "0.4", default-features = false }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
unicode-general-category = "1"
unicode-normalization = "0.1"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zstd = "0.13"

[build-dependencies]
capnpc = "0.25"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = "debuginfo"

[lints.clippy]
await_holding_lock = "deny"
