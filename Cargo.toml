[package]
name = "roadviewer-hars"
version = "2.0.13"
edition = "2024"
license = "MIT"
repository = "https://github.com/Qualified4/roadviewer-hars"
build = "build.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["macros", "multipart"] }
base64 = "0.22"
bytes = "1"
crc32fast = "1"
capnp = "0.25"
flate2 = "1"
fs2 = "0.4"
futures-util = { version = "0.3", default-features = false }
hex = "0.4"
hmac = "0.12"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
md-5 = "0.10"
rand = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
# Thumbnail decoders: SIMD features off, so the decoder crates are all `forbid(unsafe_code)`.
rusty_h264-decoder = { version = "=0.17.2", default-features = false, features = ["std"] }
rusty_h265 = { version = "=0.7.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shiguredo_mp4 = "=2026.5.0"
mpeg2ts = "=0.6.1"
sha2 = "0.10"
subtle = "2"
tar = { version = "0.4", default-features = false }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
unicode-general-category = "1"
unicode-normalization = "0.1"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zstd = "0.13"

[build-dependencies]
capnpc = "0.25"

[dev-dependencies]

[profile.release]
lto = "thin"
strip = "debuginfo"

# The thumbnail tests decode real video. Unoptimised, these four crates took 33 s of one test;
# optimised they take 11 s. Only test and debug builds are affected: release already optimises.
[profile.dev.package.rusty_h264-common]
opt-level = 3
[profile.dev.package.rusty_h264-decoder]
opt-level = 3
[profile.dev.package.rusty_h265]
opt-level = 3
[profile.dev.package.rusty_h265-accel]
opt-level = 3

[lints.clippy]
await_holding_lock = "deny"
