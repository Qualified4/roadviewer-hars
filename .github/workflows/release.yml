name: HARS release
on:
  push:
    # Prerelease tags as before, plus stable N.N.N tags (no suffix).
    tags: ['2.0.0-alpha.*', '2.0.0-beta.*', '2.0.0-rc.*', '[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: read
jobs:
  gate:
    if: github.repository == 'Qualified4/roadviewer-hars'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/check_release.py --tag "$GITHUB_REF_NAME"
      # capnproto builds the product. The ffmpeg CLI is a development tool for the tests only
      # (synthetic inputs, independent decoding); the image is checked below to hold none of it.
      - name: Native test dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y capnproto ffmpeg
      - run: rustup update stable --no-self-update && rustup component add rustfmt clippy
      - run: cargo fmt --all --check && cargo clippy --locked --all-targets -- -D warnings && cargo test --locked --all-targets
  image:
    needs: gate
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker build --build-arg BUILD_ARCH=${{ matrix.arch }} --build-arg BUILD_VERSION="$GITHUB_REF_NAME" --tag "ghcr.io/qualified4/roadviewer-hars:$GITHUB_REF_NAME-${{ matrix.arch }}" .
      - run: python3 scripts/image_report.py "ghcr.io/qualified4/roadviewer-hars:$GITHUB_REF_NAME-${{ matrix.arch }}" --require-no-ffmpeg --summary "$GITHUB_STEP_SUMMARY" > /dev/null
      - run: python3 scripts/container_smoke.py "ghcr.io/qualified4/roadviewer-hars:$GITHUB_REF_NAME-${{ matrix.arch }}"
      - run: docker push "ghcr.io/qualified4/roadviewer-hars:$GITHUB_REF_NAME-${{ matrix.arch }}"
  manifest:
    needs: [gate, image]
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Publish HARS-only multiarch manifest
        run: docker buildx imagetools create --tag "ghcr.io/qualified4/roadviewer-hars:$GITHUB_REF_NAME" "ghcr.io/qualified4/roadviewer-hars:$GITHUB_REF_NAME-amd64" "ghcr.io/qualified4/roadviewer-hars:$GITHUB_REF_NAME-aarch64"
      # A tag with a suffix (2.0.0-alpha.N) is a GitHub prerelease; a plain N.N.N tag is the stable, latest
      # release. Only the version image tag above is published: Home Assistant pulls by version, never `latest`.
      - name: Publish release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then kind=--prerelease; else kind=--latest; fi
          gh release create "$GITHUB_REF_NAME" "$kind" --title "Road Viewer $GITHUB_REF_NAME" --notes-file docs/hars/STATUS.md
