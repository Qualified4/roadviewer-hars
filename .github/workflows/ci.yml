name: HARS CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hars-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-24.04
    env:
      # Neither is of use on a runner that starts from a cache, and both made the cached target
      # directory large: incremental state, and full debug info (file and line stay in backtraces).
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      NEXTEST_VERSION: "0.9.100"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The product builds without any media library. The ffmpeg CLI is a development tool here
      # only: tests make synthetic inputs with it and use it as an independent decoder and reader.
      - name: Native test dependencies
        run: |
          # Rebuilding the manual page index after the install is the slowest part of it.
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends capnproto ffmpeg
      - name: Rust stable and the test runner
        run: |
          rustup update stable --no-self-update && rustup component add rustfmt clippy
          curl -LsSf "https://get.nexte.st/$NEXTEST_VERSION/linux" | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: hars-rust-v2-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      # cargo-nextest runs the same tests as `cargo test --all-targets`, each in its own process and
      # the test programs side by side.
      - run: cargo nextest run --locked --all-targets
      - name: Original ccnc client and offline authentication migration
        run: |
          python3 -m venv /tmp/hars-compat-env
          /tmp/hars-compat-env/bin/pip install -r reference/python/roadviewer/requirements.txt aiohttp
          cargo build --locked
          /tmp/hars-compat-env/bin/python integration/ccnc_compat.py --rust "$PWD/target/debug/roadviewer-hars"
      - name: Python and Rust full replay conversion oracle
        run: /tmp/hars-compat-env/bin/python integration/pipeline_contract.py "$PWD/target/debug/roadviewer-hars"
      - name: Original client upload fault injection
        run: /tmp/hars-compat-env/bin/python integration/uploader_faults.py --rust "$PWD/target/debug/roadviewer-hars"
      - run: python3 scripts/verify_reference.py
      - run: python3 scripts/check_release.py
      - run: python3 scripts/check_coexistence.py
  container:
    name: Container (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Build native architecture image
        run: docker build --build-arg BUILD_ARCH=${{ matrix.arch }} --tag hars-ci .
      - name: No FFmpeg executable, library or link in the image; image size
        run: python3 scripts/image_report.py hars-ci --require-no-ffmpeg --summary "$GITHUB_STEP_SUMMARY" > image-report-${{ matrix.arch }}.json
      - name: Keep the image size report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: image-report-${{ matrix.arch }}
          path: image-report-${{ matrix.arch }}.json
          if-no-files-found: warn
      - name: Boot container, verify HTTP and isolated TLS device listener
        run: python3 scripts/container_smoke.py hars-ci
  # HARS's browser tests (tests/browser, docs/hars/BROWSER-TESTS.md) against HARS. The HARS executable is built
  # once, from the Rust checks job's dependency cache (restored, never saved: one cache entry), and handed to
  # the shards.
  browser-build:
    name: Browser build
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7
      - name: Native build dependency
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends capnproto
      - run: rustup update stable --no-self-update
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: hars-rust-v2-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}
      - run: cargo build --locked --bin roadviewer-hars
      - uses: actions/upload-artifact@v4
        with:
          name: hars-debug-bin
          path: target/debug/roadviewer-hars
          retention-days: 1
          if-no-files-found: error
  browser-shards:
    name: Browser shard ${{ matrix.shard }}
    needs: [browser-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # One tests/browser/browser-groups.json group per shard, run serially. Five shards of two groups took
        # 84-174 s on the runner, unevenly; one group each shortens the longest path (BROWSER-TESTS.md).
        include:
          - {shard: 1, groups: g1}
          - {shard: 2, groups: g2}
          - {shard: 3, groups: g3}
          - {shard: 4, groups: g4}
          - {shard: 5, groups: g5}
          - {shard: 6, groups: g6}
          - {shard: 7, groups: g7}
          - {shard: 8, groups: g8}
          - {shard: 9, groups: g9}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.13.1'
          cache: npm
          cache-dependency-path: integration/upstream_cjs/package-lock.json
      - run: npm ci --prefix integration/upstream_cjs
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('integration/upstream_cjs/package-lock.json') }}
      - run: npx --prefix integration/upstream_cjs playwright install --only-shell chromium
      # No `playwright install-deps`: the hosted runner already has Chromium's shared libraries (it ships Google
      # Chrome). If an image update removes one, this fails here instead of in every test.
      - name: Browser shared libraries are present
        run: |
          shell=$(ls ~/.cache/ms-playwright/chromium_headless_shell-*/chrome-headless-shell-linux64/chrome-headless-shell)
          ! ldd "$shell" | grep 'not found'
      - uses: actions/download-artifact@v4
        with:
          name: hars-debug-bin
          path: hars-bin
      - run: chmod +x hars-bin/roadviewer-hars
      # Every test runs in a user+network namespace with only loopback (unshare -rn). Ubuntu 24.04's AppArmor
      # restriction on unprivileged user namespaces would leave the namespace without the capability to bring lo
      # up; it is lifted for this job. The check fails the job unless an outside address is unreachable inside.
      - name: Loopback-only network namespace
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare -rn sh -c 'ip link set lo up && python3 integration/upstream_cjs/run_browser_tests.py --isolation-check'
      - name: Browser tests
        run: |
          set +e
          python3 integration/upstream_cjs/run_browser_tests.py --hars-bin hars-bin/roadviewer-hars \
            --out browser-out --groups ${{ matrix.groups }}
          code=$?
          echo "$code" > browser-out/exit-code
          exit "$code"
      - name: Keep the shard summary
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-summary-${{ matrix.shard }}
          path: |
            browser-out/summary.json
            browser-out/exit-code
          retention-days: 7
          if-no-files-found: warn
      - name: Keep the test logs, screenshots and traces
        if: ${{ !success() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-artifacts-${{ matrix.shard }}
          path: browser-out
          retention-days: 7
          if-no-files-found: warn
  browser:
    name: Browser checks
    if: ${{ always() }}
    needs: [browser-shards]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # The gate data (excluded set exactly replay_format2, restart only for maps many/leak, no rerun kinds) and
      # the verdict rules, without a browser.
      - name: Gate rules
        run: python3 integration/upstream_cjs/test_gate_rules.py
      - uses: actions/download-artifact@v4
        with:
          pattern: browser-summary-*
          path: shards
      # Recomputed from the shards' results: all 51 entries once, each shard's exit status agreeing with its summary.
      - name: Gate over every shard
        run: python3 integration/upstream_cjs/run_browser_tests.py --aggregate shards/* --out browser-gate
      - name: Keep the gate summary
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-gate
          path: browser-gate/summary.json
          retention-days: 7
          if-no-files-found: warn
  required:
    name: HARS required
    if: ${{ always() }}
    needs: [rust, container, browser]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every check and architecture
        env:
          RUST_RESULT: ${{ needs.rust.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$RUST_RESULT" = success && test "$CONTAINER_RESULT" = success && test "$BROWSER_RESULT" = success
