name: HARS CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hars-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
# A push to main runs only the cache refresh jobs: main receives only pull requests that passed `HARS required`
# on the tree being merged, so the checks are not run again there. Pull requests and manual runs run every
# check, and restore the caches main saved (a pull request can read only its own and main's caches); they
# never save a Rust cache. A pull request that changes Cargo.lock misses and builds from scratch.
jobs:
  rust-lint:
    name: Rust lint
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-24.04
    env:
      # Neither is of use on a runner that starts from a cache, and both made the cached target
      # directory large: incremental state, and full debug info (file and line stay in backtraces).
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7
      # build.rs compiles the preserved cereal schemas with capnp. Nothing here runs ffmpeg.
      - name: Native build dependency
        run: |
          # Rebuilding the manual page index after the install is the slowest part of it.
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends capnproto
      - run: rustup update stable --no-self-update && rustup component add rustfmt clippy
      # clippy writes check metadata, not the test build's objects, so it has its own cache.
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: hars-rust-lint-v1-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}
          # A release bumps the version in Cargo.toml and Cargo.lock: main's last cache still has the crates and
          # most of the build.
          restore-keys: hars-rust-lint-v1-${{ runner.os }}-
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
  rust-tests:
    name: Rust tests
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      NEXTEST_VERSION: "0.9.100"
    steps:
      - uses: actions/checkout@v7
      # The product builds without any media library. The ffmpeg CLI is a development tool here
      # only: tests make synthetic inputs with it and use it as an independent decoder and reader.
      - name: Native test dependencies
        uses: ./.github/actions/test-packages
      - name: Rust stable and the test runner
        run: |
          rustup update stable --no-self-update
          curl -LsSf "https://get.nexte.st/$NEXTEST_VERSION/linux" | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: hars-rust-test-v1-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}
          # A release bumps the version in Cargo.toml and Cargo.lock: main's last cache still has the crates and
          # most of the build.
          restore-keys: hars-rust-test-v1-${{ runner.os }}-
      # cargo-nextest runs the same tests as `cargo test --all-targets`, each in its own process and
      # the test programs side by side.
      - run: cargo nextest run --locked --all-targets
  # The pinned openpilot RV1 client against the HARS debug executable that Browser build made.
  compatibility:
    name: Compatibility
    if: ${{ github.event_name != 'push' }}
    needs: [browser-build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: RV1 client dependency
        run: |
          python3 -m venv /tmp/hars-compat-env
          /tmp/hars-compat-env/bin/pip install aiohttp
      - uses: actions/download-artifact@v4
        with:
          name: hars-debug-bin
          path: hars-bin
      - run: chmod +x hars-bin/roadviewer-hars
      - name: Original ccnc client and offline authentication migration
        run: /tmp/hars-compat-env/bin/python integration/ccnc_compat.py --rust "$PWD/hars-bin/roadviewer-hars"
      - name: Original client upload fault injection
        run: /tmp/hars-compat-env/bin/python integration/uploader_faults.py --rust "$PWD/hars-bin/roadviewer-hars"
  # Python only, no build.
  repository:
    name: Repository checks
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/check_release.py
      - run: python3 scripts/check_coexistence.py
  container:
    name: Container (${{ matrix.arch }})
    if: ${{ github.event_name != 'push' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Build native architecture image
        run: docker build --build-arg BUILD_ARCH=${{ matrix.arch }} --tag hars-ci .
      - name: No FFmpeg executable, library or link in the image; image size
        run: python3 scripts/image_report.py hars-ci --require-no-ffmpeg --summary "$GITHUB_STEP_SUMMARY" > image-report-${{ matrix.arch }}.json
      - name: Keep the image size report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: image-report-${{ matrix.arch }}
          path: image-report-${{ matrix.arch }}.json
          if-no-files-found: warn
      - name: Boot container, verify HTTP and isolated TLS device listener
        run: python3 scripts/container_smoke.py hars-ci
  # HARS's browser tests (tests/browser, docs/hars/BROWSER-TESTS.md) against HARS. The HARS executable is built
  # once, from the Rust tests cache (restored, never saved here), and handed to the shards and to Compatibility.
  browser-build:
    name: Browser build
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7
      - name: Native build dependency
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends capnproto
      - run: rustup update stable --no-self-update
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: hars-rust-test-v1-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}
          # A release bumps the version in Cargo.toml and Cargo.lock: main's last cache still has the crates and
          # most of the build.
          restore-keys: hars-rust-test-v1-${{ runner.os }}-
      - run: cargo build --locked --bin roadviewer-hars
      - uses: actions/upload-artifact@v4
        with:
          name: hars-debug-bin
          path: target/debug/roadviewer-hars
          retention-days: 1
          if-no-files-found: error
  browser-shards:
    name: Browser shard ${{ matrix.shard }}
    if: ${{ github.event_name != 'push' }}
    needs: [browser-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # One tests/browser/browser-groups.json group per shard, run serially. Five shards of two groups took
        # 84-174 s on the runner, unevenly; one group each shortens the longest path (BROWSER-TESTS.md).
        include:
          - {shard: 1, groups: g1}
          - {shard: 2, groups: g2}
          - {shard: 3, groups: g3}
          - {shard: 4, groups: g4}
          - {shard: 5, groups: g5}
          - {shard: 6, groups: g6}
          - {shard: 7, groups: g7}
          - {shard: 8, groups: g8}
          - {shard: 9, groups: g9}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.13.1'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - run: npm ci --prefix tests/browser
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/browser/package-lock.json') }}
      - run: npx --prefix tests/browser playwright install --only-shell chromium
      # No `playwright install-deps`: the hosted runner already has Chromium's shared libraries (it ships Google
      # Chrome). If an image update removes one, this fails here instead of in every test.
      - name: Browser shared libraries are present
        run: |
          shell=$(ls ~/.cache/ms-playwright/chromium_headless_shell-*/chrome-headless-shell-linux64/chrome-headless-shell)
          ! ldd "$shell" | grep 'not found'
      - uses: actions/download-artifact@v4
        with:
          name: hars-debug-bin
          path: hars-bin
      - run: chmod +x hars-bin/roadviewer-hars
      # Every test runs in a user+network namespace with only loopback (unshare -rn). Ubuntu 24.04's AppArmor
      # restriction on unprivileged user namespaces would leave the namespace without the capability to bring lo
      # up; it is lifted for this job. The check fails the job unless an outside address is unreachable inside.
      - name: Loopback-only network namespace
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare -rn sh -c 'ip link set lo up && python3 tests/browser/run_browser_tests.py --isolation-check'
      - name: Browser tests
        run: |
          set +e
          python3 tests/browser/run_browser_tests.py --hars-bin hars-bin/roadviewer-hars \
            --out browser-out --groups ${{ matrix.groups }}
          code=$?
          echo "$code" > browser-out/exit-code
          exit "$code"
      - name: Keep the shard summary
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-summary-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: |
            browser-out/summary.json
            browser-out/exit-code
          retention-days: 7
          if-no-files-found: warn
      - name: Keep the test logs, screenshots and traces
        if: ${{ !success() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-artifacts-${{ matrix.shard }}
          path: browser-out
          retention-days: 7
          if-no-files-found: warn
  browser:
    name: Browser checks
    if: ${{ always() && github.event_name != 'push' }}
    needs: [browser-shards]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # The manifest, allowed restart and verdict rules, without a browser.
      - name: Gate rules
        run: python3 tests/browser/test_gate_rules.py
      - uses: actions/download-artifact@v4
        with:
          pattern: browser-summary-*
          path: shards
      # Reuse successful shards from earlier attempts when GitHub reruns just one shard.
      - name: Gate over every shard
        run: |
          summaries=()
          for shard in {1..9}; do
            latest=$(printf '%s\n' shards/browser-summary-"$shard"-attempt-* | sort -V | tail -n 1)
            summaries+=("$latest")
          done
          python3 tests/browser/run_browser_tests.py --aggregate "${summaries[@]}" --out browser-gate
      - name: Keep the gate summary
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-gate
          path: browser-gate/summary.json
          retention-days: 7
          if-no-files-found: warn
  # The one required check. It runs on every event except a push (pull_request, workflow_dispatch, and any event
  # added later), and fails unless every check job succeeded: a failed, cancelled or skipped job fails it.
  required:
    name: HARS required
    if: ${{ always() && github.event_name != 'push' }}
    needs: [rust-lint, rust-tests, compatibility, repository, container, browser-build, browser-shards, browser]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every check and architecture
        env:
          RUST_LINT_RESULT: ${{ needs.rust-lint.result }}
          RUST_TESTS_RESULT: ${{ needs.rust-tests.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
          BROWSER_BUILD_RESULT: ${{ needs.browser-build.result }}
          BROWSER_SHARDS_RESULT: ${{ needs.browser-shards.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$RUST_LINT_RESULT" = success && test "$RUST_TESTS_RESULT" = success \
            && test "$COMPATIBILITY_RESULT" = success && test "$REPOSITORY_RESULT" = success \
            && test "$CONTAINER_RESULT" = success && test "$BROWSER_BUILD_RESULT" = success \
            && test "$BROWSER_SHARDS_RESULT" = success && test "$BROWSER_RESULT" = success
  # Push to main only: save the caches the pull request jobs restore, with the same keys and paths. Each Rust
  # job first looks its key up without downloading; on a hit (Cargo.lock, Cargo.toml, rust-toolchain.toml
  # unchanged) it stops there. On a miss it compiles what the checks compile, without running a test, a browser
  # or a container. The container jobs keep no cache (plain docker build), so there is nothing to refresh.
  cache-rust-lint:
    name: Cache refresh (Rust lint)
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7
      - id: lookup
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: hars-rust-lint-v1-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}
          lookup-only: true
      - name: Native build dependency
        if: ${{ steps.lookup.outputs.cache-hit != 'true' }}
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends capnproto
      - if: ${{ steps.lookup.outputs.cache-hit != 'true' }}
        run: rustup update stable --no-self-update && rustup component add rustfmt clippy
      # The same arguments as Rust lint: clippy's arguments are part of what cargo compares before reusing a result.
      - if: ${{ steps.lookup.outputs.cache-hit != 'true' }}
        run: cargo clippy --locked --all-targets -- -D warnings
      - if: ${{ steps.lookup.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: hars-rust-lint-v1-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}
  cache-rust-tests:
    name: Cache refresh (Rust tests)
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      NEXTEST_VERSION: "0.9.100"
    steps:
      - uses: actions/checkout@v7
      - id: lookup
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: hars-rust-test-v1-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}
          lookup-only: true
      # Compiling needs capnp only; ffmpeg is needed to run the tests, which this job does not.
      - name: Native build dependency
        if: ${{ steps.lookup.outputs.cache-hit != 'true' }}
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends capnproto
      - name: Rust stable and the test runner
        if: ${{ steps.lookup.outputs.cache-hit != 'true' }}
        run: |
          rustup update stable --no-self-update
          curl -LsSf "https://get.nexte.st/$NEXTEST_VERSION/linux" | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"
      # The test programs of Rust tests, and the debug executable of Browser build.
      - if: ${{ steps.lookup.outputs.cache-hit != 'true' }}
        run: cargo nextest run --locked --all-targets --no-run && cargo build --locked --bin roadviewer-hars
      - if: ${{ steps.lookup.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: hars-rust-test-v1-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}
  # The .deb files of the test packages (capnproto, ffmpeg) for Rust tests: the
  # runners' Ubuntu mirror has been slow. Saved only when the runner image's cache does not hold them yet.
  cache-packages:
    name: Cache refresh (packages)
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/test-packages
        with:
          save: 'true'
  # The npm cache (setup-node, saved after the job on a miss) and the Playwright shell cache of the browser shards,
  # with the shards' steps. No browser starts.
  cache-browser:
    name: Cache refresh (browser)
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.13.1'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - run: npm ci --prefix tests/browser
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/browser/package-lock.json') }}
      - run: npx --prefix tests/browser playwright install --only-shell chromium
