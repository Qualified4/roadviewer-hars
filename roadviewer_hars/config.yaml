name: Road Viewer
version: "2.1.7"
slug: roadviewer_hars
image: ghcr.io/qualified4/roadviewer-hars
description: Rust로 다시 구현한 Road Viewer 2.x · Python Road Viewer 1.x의 후속
url: https://github.com/Qualified4/roadviewer-hars
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
hassio_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:road-variant
panel_title: Road Viewer
options:
  max_upload_mb: 512
  device_https_enabled: false
  device_certfile: fullchain.pem
  device_keyfile: privkey.pem
  archive_gdrive_client_id: ""
  archive_gdrive_client_secret: ""
schema:
  max_upload_mb: int(16,2048)
  device_https_enabled: bool
  device_certfile: str
  device_keyfile: str
  archive_gdrive_client_id: str
  archive_gdrive_client_secret: password
ports:
  8443/tcp: null
ports_description:
  8443/tcp: 장치 업로드용 HTTPS 포트
map:
  - type: ssl
    read_only: true
  - type: share
    read_only: false
backup_exclude:
  - "roadviewer-hars/[0-9a-f]*"
  - "roadviewer-hars/.uploads*"
  - "roadviewer-hars/.exports*"
