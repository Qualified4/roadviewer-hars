name: Road Viewer HARS
version: "2.0.0-alpha.3"
slug: roadviewer_hars
image: ghcr.io/qualified4/roadviewer-hars
description: Rust Road Viewer 2.x · 기능 이식 중인 독립 테스트용 alpha
url: https://github.com/Qualified4/roadviewer-hars
arch:
  - amd64
  - aarch64
startup: application
boot: manual
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:road-variant
panel_title: Road Viewer HARS
options:
  max_upload_mb: 512
  device_https_enabled: false
  device_certfile: fullchain.pem
  device_keyfile: privkey.pem
schema:
  max_upload_mb: int(16,2048)
  device_https_enabled: bool
  device_certfile: str
  device_keyfile: str
ports:
  8443/tcp: null
ports_description:
  8443/tcp: HARS 전용 HTTPS 테스트 포트 · 운영 포트 사용은 별도 승인 필요
map:
  - type: ssl
    read_only: true
backup_exclude:
  - "roadviewer-hars/[0-9a-f]*"
  - "roadviewer-hars/.uploads*"
  - "roadviewer-hars/.exports*"
